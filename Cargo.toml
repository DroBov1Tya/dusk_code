[workspace]
resolver = "3"
members = ["projects/core", "projects/tui"]
default-members = ["projects/tui"]

[workspace.package]
version = "0.49.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rmcp = { version = "3.8", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
clap = "4"
proptest = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"] }
uuid = { version = "1", features = ["v7"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate"] }
nix = { version = "0.31", default-features = false, features = ["signal"] }
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
include_dir = "0.7.4"
unicode-width = "0.2"
dusk_core = { path = "projects/core" }

[workspace]
resolver = "3"
members = ["projects/core", "projects/cli"]
default-members = ["projects/cli"]

[workspace.package]
version = "0.15.1"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
clap = "4"
proptest = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v7"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate"] }
nix = { version = "0.31", default-features = false, features = ["signal"] }
dusk_core = { path = "projects/core" }

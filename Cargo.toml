[workspace]
resolver = "3"
members = ["projects/core", "projects/evals", "projects/external/telegram", "projects/gui", "projects/protocol", "projects/tui"]
default-members = ["projects/tui"]

[workspace.package]
version = "0.72.5"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rmcp = { version = "3.8", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest", "auth"] }
clap = "4"
proptest = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"] }
uuid = { version = "1", features = ["v4", "v7"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate"] }
parking_lot = "0.12"
# The system keychain; exact, since it holds the keys of every provider.
keyring = "=4.2.0"
# The sounds a chat plays, and the microphone it dictates from.
rodio = { version = "=0.23.0", default-features = false, features = ["playback", "recording", "flac", "mp3", "mp4", "vorbis", "wav"] }
nix = { version = "0.31", default-features = false, features = ["signal"] }
ratatui = "0.30.2"
base64 = "0.22.1"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ignore = "0.4"
regex = "1"
schemars = "1.2"
# No default features: schemas never fetch remote or file references.
jsonschema = { version = "0.60", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.11"
async-trait = "0.1"
teloxide = { version = "0.17", default-features = false, features = ["macros", "rustls", "throttle"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
sha1 = "0.11"
unicode-width = "0.2"
dusk_core = { path = "projects/core" }
dusk_protocol = { path = "projects/protocol" }
dusk_telegram = { path = "projects/external/telegram" }

# Dependencies carry no debug info in dev builds: it was most of target/ and nobody steps
# into them. Our own crates keep line tables, enough for backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Stripped binaries are about a fifth smaller. No LTO: it costs minutes of CI per release.
[profile.release]
strip = true

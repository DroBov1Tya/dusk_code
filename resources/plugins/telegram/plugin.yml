name: telegram
version: 1.0.0
description: "Talk to duskcode from Telegram: messages, answers, questions and approvals."
permissions:
  # It reaches Telegram only, through the core's broker.
  network: [https://api.telegram.org]
  # A bot token from @BotFather: typed in /plugins each session, kept in memory only and
  # never saved. Its bot library talks to Telegram itself, so it reads the token.
  keys:
    - name: token
      origins: [https://api.telegram.org]
      handed: true
platform:
  command: [duskcode, --platform, telegram]

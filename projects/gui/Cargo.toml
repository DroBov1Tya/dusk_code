[package]
name = "dusk_gui"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "duskcode-gui"
path = "src/main.rs"

[features]
# A development tool: the window can save pictures of its pages from a script, with no
# screen-recording permission. See `screenshot.rs`.
screenshot = ["dep:image", "dep:gpui_pre", "dep:gpui_pre_platform"]

[dependencies]
chrono.workspace = true
anyhow.workspace = true
image = { workspace = true, optional = true }
# Only for the screenshot tool: the same versions gpui-kit uses, with the in-memory renderer.
gpui_pre = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"], optional = true }
gpui_pre_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["test-support"], optional = true }
dusk_core.workspace = true
dusk_web.workspace = true
dusk_protocol.workspace = true
gpui-kit = { version = "=0.9.0", features = ["syntect"] }
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.11" }
serde.workspace = true
rodio.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

# The Dock icon for a bare binary; these versions are already in the lockfile.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData"] }

[package]
name = "dusk_gui"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "duskcode-gui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
dusk_core.workspace = true
dusk_protocol.workspace = true
gpui-kit = "=0.9.0"
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.11" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

# The Dock icon for a bare binary; these versions are already in the lockfile.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData"] }

[package]
name = "dusk_core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
dusk_protocol.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
reqwest.workspace = true
rmcp.workspace = true
base64.workspace = true
# The plugin broker reads request heads with it; already in the tree under hyper.
httparse = "1"
aws-lc-rs.workspace = true
chrono.workspace = true
getrandom.workspace = true
futures.workspace = true
ignore.workspace = true
image.workspace = true
regex.workspace = true
schemars.workspace = true
jsonschema.workspace = true
sha2.workspace = true
sha1.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
portable-pty.workspace = true
keyring.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
sqlx.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["highsierra"] }
# The cursor overlay: one borderless window drawn by Core Animation.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDate", "NSGeometry", "NSRunLoop", "NSString", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSColor", "NSGraphics", "NSResponder", "NSRunningApplication", "NSScreen", "NSView", "NSWindow", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CAAnimation", "CALayer", "CAMediaTiming", "CAMediaTimingFunction", "CAShapeLayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColor", "CGPath"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSButton", "NSCell", "NSControl", "NSWorkspace", "libc"] }

[dev-dependencies]
proptest.workspace = true

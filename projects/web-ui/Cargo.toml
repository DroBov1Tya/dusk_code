[package]
name = "dusk_web_ui"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "dusk_web_ui"
path = "src/main.rs"

[dependencies]
dusk_protocol.workspace = true
leptos = { version = "=0.8.23", features = ["csr"] }
futures = { workspace = true, features = ["std"] }
console_error_panic_hook = "=0.1.7"
js-sys = "=0.3.107"
pulldown-cmark = { version = "0.13", default-features = false }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
web-sys = { version = "=0.3.107", features = [
    "BinaryType", "CloseEvent", "Document", "Element", "Event", "EventTarget", "History",
    "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "KeyboardEvent", "Location",
    "MessageEvent", "Request", "RequestInit", "RequestCredentials", "Response", "Storage",
    "Window", "WebSocket", "MediaDevices", "MediaStream", "MediaStreamTrack", "Navigator",
    "AudioContext", "AudioContextState", "MediaStreamAudioSourceNode", "ScriptProcessorNode",
    "AudioProcessingEvent", "AudioBuffer", "AudioDestinationNode", "AudioNode",
    "MediaStreamConstraints", "Headers", "Blob", "BlobPropertyBag", "Url", "HtmlAudioElement",
    "HtmlMediaElement", "DomTokenList", "CssStyleDeclaration", "File", "FileList",
    "DataTransfer", "ClipboardEvent", "DragEvent",
] }

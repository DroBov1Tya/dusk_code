# Weekly updates, grouped so a week is one pull request per ecosystem, not dozens. Major
# versions come as their own pull requests, since they need code changes; the limits keep
# the queue short. Each pull request still passes ci-ok, deny and osv included.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

# The project's page on GitHub Pages: site/index.html with the screenshots of the readme
# beside it. Runs when either changes on main.
name: pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/screenshots/**
      - projects/clients/desktop/assets/icon.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble
        run: |
          mkdir -p _site/img
          cp site/index.html _site/
          cp docs/screenshots/desktop.png docs/screenshots/desktop-subagents.png \
            docs/screenshots/terminal.png docs/screenshots/web.png _site/img/
          cp projects/clients/desktop/assets/icon.png _site/img/icon.png
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

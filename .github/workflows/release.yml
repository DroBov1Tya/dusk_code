# A tag v* builds duskcode for macOS arm64 and Linux amd64/arm64 and publishes a release.
# Started by hand, it only builds, to check the build before a tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        # Only round versions (minor a multiple of ten, patch zero) are full releases;
        # every other tag ships as a pre-release, which "latest" skips.
        run: |
          flag=--prerelease
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.([0-9]+)\.0$ ]] && (( BASH_REMATCH[1] % 10 == 0 )); then
            flag=--latest
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes "$flag"

  build:
    needs: create
    if: always() && (needs.create.result == 'success' || needs.create.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p dusk_tui
      - name: Package
        shell: bash
        run: |
          name=duskcode-${{ matrix.target }}
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/duskcode" LICENSE README.md "dist/$name/"
          cp resources/skills/NOTICE.md "dist/$name/SKILLS-NOTICE.md"
          cp -R resources "dist/$name/resources"
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "dusk_core"))')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "release tag does not match Cargo package version" >&2
            exit 1
          fi
          printf '%s\n' "$version" > "dist/$name/resources/VERSION"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          "./dist/$name/duskcode" --version
      - name: Upload
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # GitHub keeps a SHA-256 digest of every asset; installers check against it.
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY"

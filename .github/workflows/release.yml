# A tag v* builds duskcode for macOS arm64 and Linux amd64/arm64 and publishes a release;
# the desktop client also ships: as Duskcode.app in a disk image on macOS, and as an AppImage
# on Linux amd64 and arm64.
# Started by hand, it only builds, to check the build before a tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A minor version (patch zero) is a full release, made after end-to-end testing;
        # a patch version ships as a pre-release, which "latest" skips. The notes are the
        # version's section of CHANGELOG.md, or generated when it has none.
        run: |
          flag=--prerelease
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.0$ ]]; then
            flag=--latest
          fi
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## $version " 'index($0, head) == 1 { on = 1; next } /^## / { on = 0 } on' \
            CHANGELOG.md > notes.md
          if [[ -s notes.md ]]; then
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" "${notes[@]}" "$flag"

  build:
    needs: create
    if: always() && (needs.create.result == 'success' || needs.create.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          # A tag reads the cache a run on main saved; only main writes it.
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: musl
        if: contains(matrix.target, 'musl')
        # A mirror that does not answer fails a run of 45 minutes; try again a few times.
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=5 musl-tools && exit 0
            sleep $((attempt * 20))
          done
          exit 1
      - name: Build
        shell: bash
        # The desktop client builds with the terminal one in a single call on macOS, so
        # cargo shares the dependencies and compiles both at once.
        run: |
          packages=(-p dusk_tui)
          if [[ "$RUNNER_OS" == macOS ]]; then packages+=(-p dusk_gui); fi
          cargo build --release --locked --target ${{ matrix.target }} "${packages[@]}"
      - name: Package
        shell: bash
        run: |
          name=duskcode-${{ matrix.target }}
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/duskcode" LICENSE README.md "dist/$name/"
          cp resources/skills/NOTICE.md "dist/$name/SKILLS-NOTICE.md"
          cp -R resources "dist/$name/resources"
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "dusk_core"))')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "release tag does not match Cargo package version" >&2
            exit 1
          fi
          printf '%s\n' "$version" > "dist/$name/resources/VERSION"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          "./dist/$name/duskcode" --version
      - name: Desktop app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(cat "dist/duskcode-${{ matrix.target }}/resources/VERSION")
          sh scripts/package-macos.sh \
            "target/${{ matrix.target }}/release/duskcode-gui" "$version" dist
      - name: Upload the desktop app
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.dmg --repo "$GITHUB_REPOSITORY"
      - name: Upload
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # GitHub keeps a SHA-256 digest of every asset; installers check against it.
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY"

  # The desktop client for Linux as an AppImage, built on the oldest runner that is still
  # supported, so it runs on the libraries of most desktops. The window's libraries are the
  # machine's own; see scripts/package-linux.sh.
  desktop-linux:
    needs: create
    if: always() && (needs.create.result == 'success' || needs.create.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup update stable
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: appimage-${{ matrix.arch }}
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Libraries of the window
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=5 --no-install-recommends \
              clang cmake pkg-config curl imagemagick \
              libasound2-dev libfontconfig-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
              libx11-xcb-dev libxcb1-dev libvulkan-dev libssl-dev libzstd-dev && exit 0
            sleep $((attempt * 20))
          done
          exit 1
      - name: Build
        run: cargo build --release --locked -p dusk_gui
      - name: Package
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "dusk_core"))')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "release tag does not match Cargo package version" >&2
            exit 1
          fi
          sh scripts/package-linux.sh target/release/duskcode-gui "$version" ${{ matrix.arch }} dist
      - name: Upload
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.AppImage --repo "$GITHUB_REPOSITORY"

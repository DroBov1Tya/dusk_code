# A tag v* builds duskcode for macOS arm64 and Linux amd64/arm64 and publishes a release;
# the kind comes from the branch that holds the tagged commit: `stable` is a full release,
# `beta` a pre-release titled "(beta)", anything else (nightlies, tagged on main) a pre-release;
# the desktop client also ships: as Duskcode.app in a disk image on macOS, and as an AppImage
# on Linux amd64 and arm64. Every release carries a CycloneDX SBOM of each shipped program.
# A full release (tagged on `stable` or `beta`) builds every program. A nightly builds only
# the programs whose code changed since the previous tag (scripts/release-plan.sh) and says
# so in its notes. Started by hand, it only builds everything, to check the build before a tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  TOOLCHAIN: "1.99.1" # the same as ci.yml, so a release is built by the compiler CI tested

jobs:
  # Which kind of release this is, and which programs it builds.
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      previous: ${{ steps.plan.outputs.previous }}
      cli: ${{ steps.plan.outputs.cli }}
      desktop: ${{ steps.plan.outputs.desktop }}
      web: ${{ steps.plan.outputs.web }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all history and tags: the branches that hold the commit and the diff since the previous tag
          persist-credentials: false
      - name: Plan
        id: plan
        shell: bash
        # The kind follows the branch that holds the tagged commit: `stable` is a full
        # release, `beta` a beta pre-release, any other commit (a nightly on main) a plain
        # pre-release; a run by hand is `manual`. Only a nightly builds a subset.
        run: |
          kind=manual
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            git fetch --no-tags origin '+refs/heads/beta:refs/remotes/origin/beta' '+refs/heads/stable:refs/remotes/origin/stable'
            kind=nightly
            if git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/stable; then
              kind=stable
            elif git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/beta; then
              kind=beta
            fi
          fi
          scripts/release-plan.sh "$GITHUB_SHA" "$kind" > "$RUNNER_TEMP/plan.txt"
          { echo "kind=$kind"; cat "$RUNNER_TEMP/plan.txt"; } | tee -a "$GITHUB_OUTPUT"
          # Read the two flags; the file is not sourced, as it holds a tag name.
          cli=$(sed -n 's/^cli=//p' "$RUNNER_TEMP/plan.txt")
          desktop=$(sed -n 's/^desktop=//p' "$RUNNER_TEMP/plan.txt")
          # Linux builds only the terminal client here (its desktop client is its own job).
          mac='{"target":"aarch64-apple-darwin","runner":"macos-15"}'
          linux='{"target":"x86_64-unknown-linux-musl","runner":"ubuntu-24.04"},{"target":"aarch64-unknown-linux-musl","runner":"ubuntu-24.04-arm"}'
          if [[ "$cli" == true ]]; then targets="[$mac,$linux]"
          elif [[ "$desktop" == true ]]; then targets="[$mac]"
          else targets="[]"; fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  create:
    needs: plan
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ needs.plan.outputs.kind }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
          CLI: ${{ needs.plan.outputs.cli }}
          DESKTOP: ${{ needs.plan.outputs.desktop }}
        # `stable` is a full release ("latest"); `beta` is a pre-release titled "(beta)";
        # a nightly is a plain pre-release. A tag stays vX.Y.Z so it equals the Cargo
        # version (checked in the build jobs) and the updater can still order it; the
        # title, not the tag, says beta. The notes are the version's section of
        # CHANGELOG.md, or generated when it has none; a nightly that builds a subset
        # adds which programs are in it and where the others are.
        run: |
          flag=--prerelease
          title="$GITHUB_REF_NAME"
          if [[ "$KIND" == stable ]]; then
            flag=--latest
          elif [[ "$KIND" == beta ]]; then
            title="$GITHUB_REF_NAME (beta)"
          fi
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## $version " 'index($0, head) == 1 { on = 1; next } /^## / { on = 0 } on' \
            CHANGELOG.md > notes.md
          notes=(--notes-file notes.md)
          [[ -s notes.md ]] || notes+=(--generate-notes)
          if [[ -n "$PREVIOUS" && ( "$CLI" == false || "$DESKTOP" == false ) ]]; then
            built=()
            [[ "$CLI" == true ]] && built+=("duskcode (terminal client)")
            [[ "$DESKTOP" == true ]] && built+=("Duskcode (desktop client)")
            printf -v list '%s, ' "${built[@]}"
            list="${list%, }"
            {
              printf '\n**Built in this pre-release:** %s.\n' "${list:-nothing}"
              printf 'Programs not listed are unchanged since %s and were not rebuilt; take them from that release, or the newest earlier one that has them.\n' "$PREVIOUS"
            } >> notes.md
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$title" "${notes[@]}" "$flag"

  build:
    needs: [plan, create]
    if: always() && (needs.create.result == 'success' || needs.create.result == 'skipped') && (needs.plan.outputs.cli == 'true' || needs.plan.outputs.desktop == 'true')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --target ${{ matrix.target }}
          rustup default "$TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          # A tag reads the cache a run on main saved; only main writes it.
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: musl
        if: contains(matrix.target, 'musl')
        # A mirror that does not answer fails a run of 45 minutes; try again a few times.
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=5 musl-tools && exit 0
            sleep $((attempt * 20))
          done
          exit 1
      - name: Web client
        # Embedded in the binary by the build that follows.
        run: scripts/build-web.sh
      - name: Build
        shell: bash
        # The desktop client builds with the terminal one in a single call on macOS, so
        # cargo shares the dependencies and compiles both at once; a nightly leaves out
        # the one that did not change.
        env:
          CLI: ${{ needs.plan.outputs.cli }}
          DESKTOP: ${{ needs.plan.outputs.desktop }}
        run: |
          packages=()
          if [[ "$CLI" == true ]]; then packages+=(-p dusk_terminal); fi
          if [[ "$RUNNER_OS" == macOS && "$DESKTOP" == true ]]; then packages+=(-p dusk_desktop); fi
          cargo build --release --locked --target ${{ matrix.target }} "${packages[@]}"
      - name: Signing certificate
        # Every release is signed by the same certificate, so macOS keeps the permissions
        # and keychain access of the last version. Without the secrets it is signed ad hoc.
        if: runner.os == 'macOS'
        shell: bash
        env:
          P12: ${{ secrets.MACOS_SIGN_P12 }}
          PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: |
          if [[ -z "$P12" ]]; then
            echo "::warning::MACOS_SIGN_P12 is not set; the clients are signed ad hoc and macOS will ask for keychain access again after every update"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          unlock="$(openssl rand -base64 24)"
          security create-keychain -p "$unlock" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$unlock" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -passin env:PASSWORD -nokeys -clcerts -legacy \
            -out "$RUNNER_TEMP/signing.pem" 2>/dev/null \
            || openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -passin env:PASSWORD -nokeys -clcerts \
              -out "$RUNNER_TEMP/signing.pem"
          rm -f "$RUNNER_TEMP/signing.p12"
          # Self-signed: trusted for code signing on this throwaway runner only.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$unlock" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "DUSK_SIGN_IDENTITY=Duskcode Release Signing" >> "$GITHUB_ENV"
      - name: Version
        id: version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "dusk_core"))')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "release tag does not match Cargo package version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Package
        if: needs.plan.outputs.cli == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name=duskcode-${{ matrix.target }}
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/duskcode" LICENSE README.md "dist/$name/"
          # The terminal client reads the keychain too: signed by the same certificate,
          # the next version is the same program to macOS and is not asked again.
          if [[ "$RUNNER_OS" == macOS && -n "${DUSK_SIGN_IDENTITY:-}" ]]; then
            codesign --force --timestamp=none --identifier dev.duskcode.cli \
              --sign "$DUSK_SIGN_IDENTITY" "dist/$name/duskcode"
            codesign --verify --strict "dist/$name/duskcode"
          fi
          cp resources/skills/NOTICE.md "dist/$name/SKILLS-NOTICE.md"
          cp -R resources "dist/$name/resources"
          printf '%s\n' "$VERSION" > "dist/$name/resources/VERSION"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          "./dist/$name/duskcode" --version
      - name: Desktop app
        if: runner.os == 'macOS' && needs.plan.outputs.desktop == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sh scripts/package-macos.sh \
            "target/${{ matrix.target }}/release/duskcode-gui" "$VERSION" dist
      - name: Upload the desktop app
        if: runner.os == 'macOS' && needs.plan.outputs.desktop == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.dmg --repo "$GITHUB_REPOSITORY"
      - name: Upload
        if: needs.plan.outputs.cli == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # GitHub keeps a SHA-256 digest of every asset; installers check against it.
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY"

  # The desktop client for Linux as an AppImage, built on the oldest runner that is still
  # supported, so it runs on the libraries of most desktops. The window's libraries are the
  # machine's own; see scripts/package-linux.sh.
  desktop-linux:
    needs: [plan, create]
    if: always() && (needs.create.result == 'success' || needs.create.result == 'skipped') && needs.plan.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: appimage-${{ matrix.arch }}
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Libraries of the window
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=5 --no-install-recommends \
              clang cmake pkg-config curl imagemagick \
              libasound2-dev libfontconfig-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
              libx11-xcb-dev libxcb1-dev libvulkan-dev libssl-dev libzstd-dev && exit 0
            sleep $((attempt * 20))
          done
          exit 1
      - name: Web client
        run: scripts/build-web.sh
      - name: Build
        run: cargo build --release --locked -p dusk_desktop
      - name: Package
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "dusk_core"))')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "release tag does not match Cargo package version" >&2
            exit 1
          fi
          sh scripts/package-linux.sh target/release/duskcode-gui "$version" ${{ matrix.arch }} dist
      - name: Upload
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.AppImage --repo "$GITHUB_REPOSITORY"

  # A CycloneDX SBOM of every crate in each shipped program: the terminal client (which
  # embeds the web client), the web client and the desktop client. Dependencies of every
  # target are listed, so one file covers all release platforms.
  sbom:
    needs: [plan, create]
    if: always() && (needs.create.result == 'success' || needs.create.result == 'skipped') && needs.plan.outputs.web == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # uploads the SBOM to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"
      - name: cargo-cyclonedx
        env:
          VERSION: "0.5.9"
          SHA256: fb8dbee9f182173e062a64a387b21a0badc6fab8b2abf9294973f012972bf6d8
        run: |
          name=cargo-cyclonedx-x86_64-unknown-linux-gnu
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/cyclonedx.tar.xz" \
            "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-$VERSION/$name.tar.xz"
          echo "$SHA256  $RUNNER_TEMP/cyclonedx.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/cyclonedx.tar.xz" -C "$RUNNER_TEMP" --strip-components=1 "$name/cargo-cyclonedx"
      - name: SBOM
        shell: bash
        env:
          CLI: ${{ needs.plan.outputs.cli }}
          DESKTOP: ${{ needs.plan.outputs.desktop }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "dusk_core"))')
          # The commit time, so the same commit gives the same file.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
            "$RUNNER_TEMP/cargo-cyclonedx" cyclonedx --format json --spec-version 1.5 --target all
          mkdir -p dist
          # Only the programs this release ships; the web client goes with either client.
          if [[ "$CLI" == true ]]; then
            cp projects/clients/terminal/dusk_terminal.cdx.json "dist/duskcode-$version.cdx.json"
          fi
          cp projects/clients/browser/dusk_browser.cdx.json "dist/duskcode-web-$version.cdx.json"
          if [[ "$DESKTOP" == true ]]; then
            cp projects/clients/desktop/dusk_desktop.cdx.json "dist/duskcode-desktop-$version.cdx.json"
          fi
      - name: Upload
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.cdx.json --repo "$GITHUB_REPOSITORY"
